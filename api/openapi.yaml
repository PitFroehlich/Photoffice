openapi: 3.0.3
info:
  title: Photoffice API
  description: |
    REST-API des Photoffice-Backends. Diese Datei ist die Quelle der Wahrheit (API-first):
    Das Backend generiert daraus Java-Interfaces, das Frontend einen Angular-Client.
  version: 0.1.0
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: system
    description: Technische Informationen über die laufende Anwendung
  - name: studio
    description: Funktionen für angemeldete Studio-Benutzer (Mandant aus dem Login)
  - name: customers
    description: Endkunden des Studios (Mandant aus dem Login)
  - name: platform
    description: Verwaltung der Studios (Mandanten) durch den Plattform-Betreiber
paths:
  /system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      security: []
      summary: Name und Version der laufenden Anwendung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /studio/me:
    get:
      tags: [studio]
      operationId: getCurrentStudioUser
      summary: Angemeldeter Studio-Benutzer mit seinem Studio und seinen Rollen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStudioUser'
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Studio-Benutzer oder kein aktives Studio zugeordnet
  # --- customers (#7) ---
  /studio/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Kunden des Studios, gefiltert und seitenweise, sortiert nach Nachname
      parameters:
        - name: search
          in: query
          description: Sucht in Vor-/Nachname, E-Mail und Ort (Groß-/Kleinschreibung egal)
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Kunden anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-Mail-Adresse im Studio bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Einzelnen Kunden lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Nicht gefunden (auch für Kunden anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Kunden ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-Mail-Adresse im Studio bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Kunden löschen
      responses:
        '204':
          description: Gelöscht
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # --- end customers ---
  /platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: Alle Studios, sortiert nach Name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResponse'
    post:
      tags: [platform]
      operationId: createTenant
      summary: Neues Studio registrieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Studio angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '409':
          description: Kürzel (slug) bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /platform/tenants/{tenantId}/suspend:
    post:
      tags: [platform]
      operationId: suspendTenant
      summary: Studio sperren – Studio-Benutzer haben danach keinen Zugriff mehr
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Studio gesperrt (auch wenn es bereits gesperrt war)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '404':
          description: Studio nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /platform/tenants/{tenantId}/reactivate:
    post:
      tags: [platform]
      operationId: reactivateTenant
      summary: Gesperrtes Studio wieder freischalten
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Studio aktiv (auch wenn es bereits aktiv war)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '404':
          description: Studio nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # --- customers (#7) ---
    CustomerInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        street:
          type: string
          maxLength: 200
        postalCode:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CustomerPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
    # --- end customers ---
    CurrentStudioUser:
      type: object
      required: [username, roles, studio]
      properties:
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [STUDIO_ADMIN, PHOTOGRAPHER]
        studio:
          $ref: '#/components/schemas/StudioSummary'
    StudioSummary:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    CreateTenantRequest:
      type: object
      required: [slug, name, adminEmail]
      properties:
        slug:
          type: string
          description: Eindeutiges Kürzel, als Subdomain verwendbar
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          example: studio-mueller
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Fotostudio Müller
        adminEmail:
          type: string
          format: email
          maxLength: 254
          description: E-Mail des ersten Studio-Admins; erhält eine Einladung zum Setzen des Passworts
          example: inhaber@studio-mueller.de
        adminFirstName:
          type: string
          maxLength: 100
          example: Maria
        adminLastName:
          type: string
          maxLength: 100
          example: Müller
    TenantResponse:
      type: object
      required: [id, slug, name, status, onboardingStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        onboardingStatus:
          type: string
          description: |
            PENDING: Keycloak-Organisation und erster Studio-Admin werden noch angelegt (bei Fehlern automatisch wiederholt).
            COMPLETED: Organisation angelegt, Einladung an den Studio-Admin verschickt.
          enum: [PENDING, COMPLETED]
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      description: Fehlerbeschreibung nach RFC 9457
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    SystemInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: photoffice-backend
        version:
          type: string
          example: 0.0.1-SNAPSHOT
