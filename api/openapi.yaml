openapi: 3.0.3
info:
  title: Photoffice API
  description: |
    REST-API des Photoffice-Backends. Diese Datei ist die Quelle der Wahrheit (API-first):
    Das Backend generiert daraus Java-Interfaces, das Frontend einen Angular-Client.
  version: 0.1.0
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: system
    description: Technische Informationen über die laufende Anwendung
  - name: studio
    description: Funktionen für angemeldete Studio-Benutzer (Mandant aus dem Login)
  - name: customers
    description: Endkunden des Studios (Mandant aus dem Login)
  - name: price-list
    description: Preisliste des Studios – Produkte, Download-Pakete, Versandarten (Mandant aus dem Login)
  - name: studio-profile
    description: Studio-Profil (Stammdaten) und Rechtstexte des Studios (Mandant aus dem Login)
  - name: galleries
    description: Galerien des Studios mit Kunden-Zuordnung und Veröffentlichung (Mandant aus dem Login)
  - name: platform
    description: Verwaltung der Studios (Mandanten) durch den Plattform-Betreiber
paths:
  /system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      security: []
      summary: Name und Version der laufenden Anwendung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /studio/me:
    get:
      tags: [studio]
      operationId: getCurrentStudioUser
      summary: Angemeldeter Studio-Benutzer mit seinem Studio und seinen Rollen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentStudioUser'
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Studio-Benutzer oder kein aktives Studio zugeordnet
  # --- customers (#7) ---
  /studio/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      summary: Kunden des Studios, gefiltert und seitenweise, sortiert nach Nachname
      parameters:
        - name: search
          in: query
          description: Sucht in Vor-/Nachname, E-Mail und Ort (Groß-/Kleinschreibung egal)
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
    post:
      tags: [customers]
      operationId: createCustomer
      summary: Kunden anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-Mail-Adresse im Studio bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/customers/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [customers]
      operationId: getCustomer
      summary: Einzelnen Kunden lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Nicht gefunden (auch für Kunden anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [customers]
      operationId: updateCustomer
      summary: Kunden ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-Mail-Adresse im Studio bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [customers]
      operationId: deleteCustomer
      summary: Kunden löschen
      responses:
        '204':
          description: Gelöscht
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # --- end customers ---
  # --- price list (#13) ---
  /studio/price-list:
    get:
      tags: [price-list]
      operationId: getPriceList
      summary: Komplette Preisliste des Studios (inkl. inaktiver Einträge)
      description: |
        Die Preisliste eines Studios ist klein (einige Dutzend Einträge) und wird daher ohne Paging als Ganzes
        geliefert. Lesen dürfen alle Studio-Benutzer, ändern nur Studio-Administratoren.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceList'
  /studio/price-list/settings:
    put:
      tags: [price-list]
      operationId: updatePriceListSettings
      summary: Steuersatz der Preisliste ändern (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceListSettingsInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceListSettings'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
  /studio/price-list/products:
    post:
      tags: [price-list]
      operationId: createProduct
      summary: Produkt (Abzug oder Download) mit Einzelpreis anlegen (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Ungültige Eingabe (z. B. Felder passen nicht zum Produkttyp)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '409':
          description: Das Produkt (Papier × Format bzw. Auflösung) gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/price-list/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [price-list]
      operationId: getProduct
      summary: Einzelnes Produkt lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Nicht gefunden (auch für Produkte anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [price-list]
      operationId: updateProduct
      summary: Produkt ändern (nur Studio-Administratoren; der Produkttyp ist unveränderlich)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Das Produkt gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [price-list]
      operationId: deleteProduct
      summary: Produkt löschen (nur Studio-Administratoren)
      responses:
        '204':
          description: Gelöscht
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/price-list/download-packages:
    post:
      tags: [price-list]
      operationId: createDownloadPackage
      summary: Download-Paket anlegen (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadPackageInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPackage'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '409':
          description: Ein Paket mit diesem Namen gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/price-list/download-packages/{packageId}:
    parameters:
      - name: packageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [price-list]
      operationId: getDownloadPackage
      summary: Einzelnes Download-Paket lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPackage'
        '404':
          description: Nicht gefunden (auch für Pakete anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [price-list]
      operationId: updateDownloadPackage
      summary: Download-Paket ändern (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadPackageInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadPackage'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Ein Paket mit diesem Namen gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [price-list]
      operationId: deleteDownloadPackage
      summary: Download-Paket löschen (nur Studio-Administratoren)
      responses:
        '204':
          description: Gelöscht
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/price-list/shipping-methods:
    post:
      tags: [price-list]
      operationId: createShippingMethod
      summary: Versandart anlegen (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingMethodInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethod'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '409':
          description: Eine Versandart mit diesem Namen gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/price-list/shipping-methods/{shippingMethodId}:
    parameters:
      - name: shippingMethodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [price-list]
      operationId: getShippingMethod
      summary: Einzelne Versandart lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethod'
        '404':
          description: Nicht gefunden (auch für Versandarten anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [price-list]
      operationId: updateShippingMethod
      summary: Versandart ändern (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingMethodInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethod'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Eine Versandart mit diesem Namen gibt es bereits
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [price-list]
      operationId: deleteShippingMethod
      summary: Versandart löschen (nur Studio-Administratoren)
      responses:
        '204':
          description: Gelöscht
        '403':
          description: Nur Studio-Administratoren dürfen die Preisliste ändern
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # --- end price list ---
  # --- studio profile (#20) ---
  /studio/profile:
    get:
      tags: [studio-profile]
      operationId: getStudioProfile
      summary: Studio-Profil (Stammdaten) des Studios
      description: |
        Lesen dürfen alle Studio-Benutzer, ändern nur Studio-Administratoren. Hat das Studio noch kein Profil
        gespeichert, kommt ein leeres Profil mit dem Studionamen als Anzeigename und Land DE (ohne updatedAt).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioProfile'
    put:
      tags: [studio-profile]
      operationId: updateStudioProfile
      summary: Studio-Profil speichern (nur Studio-Administratoren)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioProfileInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioProfile'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen das Studio-Profil ändern
  /studio/profile/legal-texts:
    get:
      tags: [studio-profile]
      operationId: listLegalTexts
      summary: Rechtstexte des Studios (AGB, Widerrufsbelehrung, Impressum, Datenschutzerklärung)
      description: |
        Liefert immer alle vier Texte in fester Reihenfolge; noch nicht gepflegte Texte haben einen leeren
        Markdown-Text und kein updatedAt. Die Texte sind Markdown; HTML darin wird bei der Anzeige nicht
        ausgeführt, sondern als Text dargestellt.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalText'
  /studio/profile/legal-texts/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/LegalTextKind'
    put:
      tags: [studio-profile]
      operationId: updateLegalText
      summary: Einen Rechtstext speichern (nur Studio-Administratoren); leerer Text entfernt ihn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalTextInput'
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalText'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Nur Studio-Administratoren dürfen Rechtstexte ändern
  # --- end studio profile ---
  # --- galleries (#8) ---
  /studio/galleries:
    get:
      tags: [galleries]
      operationId: listGalleries
      summary: Galerien des Studios, gefiltert und seitenweise, neueste zuerst
      parameters:
        - name: search
          in: query
          description: Sucht im Namen der Galerie (Groß-/Kleinschreibung egal)
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GalleryStatus'
        - name: customerId
          in: query
          description: Nur Galerien dieses Kunden
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryPage'
    post:
      tags: [galleries]
      operationId: createGallery
      summary: Galerie anlegen (Status Entwurf)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GalleryInput'
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/galleries/{galleryId}:
    parameters:
      - name: galleryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [galleries]
      operationId: getGallery
      summary: Einzelne Galerie lesen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '404':
          description: Nicht gefunden (auch für Galerien anderer Studios)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [galleries]
      operationId: updateGallery
      summary: Galerie ändern (Name, Beschreibung, Ablaufdatum, Kunden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GalleryInput'
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      tags: [galleries]
      operationId: deleteGallery
      summary: Galerie löschen (inkl. Zuordnungen; Bilder ab #9)
      responses:
        '204':
          description: Gelöscht
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/galleries/{galleryId}/publish:
    parameters:
      - name: galleryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [galleries]
      operationId: publishGallery
      summary: Galerie veröffentlichen (online schalten)
      responses:
        '200':
          description: Veröffentlicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Kann nicht veröffentlicht werden (abgelaufen, keine aktiven Preise, bereits online)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /studio/galleries/{galleryId}/unpublish:
    parameters:
      - name: galleryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [galleries]
      operationId: unpublishGallery
      summary: Galerie offline nehmen
      responses:
        '200':
          description: Offline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gallery'
        '404':
          description: Nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Galerie ist nicht online
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # --- end galleries ---
  /platform/tenants:
    get:
      tags: [platform]
      operationId: listTenants
      summary: Alle Studios, sortiert nach Name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantResponse'
    post:
      tags: [platform]
      operationId: createTenant
      summary: Neues Studio registrieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Studio angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Ungültige Eingabe
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '409':
          description: Kürzel (slug) bereits vergeben
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /platform/tenants/{tenantId}/suspend:
    post:
      tags: [platform]
      operationId: suspendTenant
      summary: Studio sperren – Studio-Benutzer haben danach keinen Zugriff mehr
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Studio gesperrt (auch wenn es bereits gesperrt war)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Ungültige Studio-ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '404':
          description: Studio nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /platform/tenants/{tenantId}/reactivate:
    post:
      tags: [platform]
      operationId: reactivateTenant
      summary: Gesperrtes Studio wieder freischalten
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Studio aktiv (auch wenn es bereits aktiv war)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Ungültige Studio-ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '404':
          description: Studio nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /platform/tenants/{tenantId}/onboarding/retry:
    post:
      tags: [platform]
      operationId: retryTenantOnboarding
      summary: Fehlgeschlagenes Onboarding sofort erneut versuchen (statt auf die automatische Wiederholung zu warten)
      description: |
        Stellt die fehlgeschlagene Zustellung des Registrierungs-Events für dieses Studio erneut zu. Das Onboarding
        läuft im Hintergrund; das Ergebnis steht danach in onboardingStatus bzw. onboardingError.
        Ohne fehlgeschlagenen Versuch (z. B. bereits abgeschlossen) passiert nichts.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '202':
          description: Erneuter Versuch angestoßen (bzw. nichts zu tun)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          description: Ungültige Studio-ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Nicht angemeldet
        '403':
          description: Keine Berechtigung (nur Plattform-Betreiber)
        '404':
          description: Studio nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # --- customers (#7) ---
    CustomerInput:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 50
        street:
          type: string
          maxLength: 200
        postalCode:
          type: string
          maxLength: 20
        city:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    CustomerPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
    # --- end customers ---
    # --- price list (#13) ---
    ProductType:
      description: |
        Produkttyp. PRINT = Abzug (Papiertyp × Format), DOWNLOAD = digitale Datei in einer frei benannten Variante (Größe).
        Weitere Typen (z. B. Fotobuch) können ergänzt werden.
      type: string
      enum: [PRINT, DOWNLOAD]
    DownloadPackageKind:
      description: IMAGE_COUNT = feste Anzahl Bilder einer Galerie, WHOLE_GALLERY = alle Bilder einer Galerie
      type: string
      enum: [IMAGE_COUNT, WHOLE_GALLERY]
    PriceListSettingsInput:
      type: object
      required: [vatRatePercent]
      properties:
        vatRatePercent:
          description: Umsatzsteuersatz in Prozent (höchstens zwei Nachkommastellen), z. B. 19 oder 0 für Kleinunternehmer
          type: number
          minimum: 0
          maximum: 99.99
          example: 19
    PriceListSettings:
      description: Alle Preise der Liste sind Bruttopreise (inkl. Umsatzsteuer) in dieser Währung.
      type: object
      required: [currency, vatRatePercent]
      properties:
        currency:
          description: Währung aller Preise (vorerst nur EUR)
          type: string
          enum: [EUR]
        vatRatePercent:
          type: number
          example: 19
    ProductInput:
      type: object
      required: [type, priceCents]
      properties:
        type:
          $ref: '#/components/schemas/ProductType'
        paperType:
          description: Nur bei PRINT (Pflicht), z. B. "Matt"
          type: string
          maxLength: 50
        printFormat:
          description: Nur bei PRINT (Pflicht), z. B. "13 × 18 cm"
          type: string
          maxLength: 50
        downloadName:
          description: Nur bei DOWNLOAD (Pflicht), frei benannte Variante, z. B. "Web 2048 px" oder "Original"
          type: string
          maxLength: 100
        maxEdgePx:
          description: >-
            Nur bei DOWNLOAD: maximale Kantenlänge in Pixeln, auf die das Bild verkleinert wird
            (200–20000); fehlt der Wert, wird das Original ausgeliefert
          type: integer
          format: int32
          minimum: 200
          maximum: 20000
        priceCents:
          description: Bruttopreis in Cent (ganzzahlig, nie Gleitkomma)
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          example: 290
        active:
          description: Nur aktive Produkte werden Kunden angeboten
          type: boolean
          default: true
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, active, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    DownloadPackageInput:
      type: object
      required: [name, kind, downloadProductId, priceCents]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 10 Downloads
        kind:
          $ref: '#/components/schemas/DownloadPackageKind'
        imageCount:
          description: Nur bei IMAGE_COUNT (Pflicht), Anzahl der enthaltenen Bilder
          type: integer
          format: int32
          minimum: 2
          maximum: 10000
        downloadProductId:
          description: Download-Variante (Produkt vom Typ DOWNLOAD), in der die Bilder des Pakets geliefert werden
          type: string
          format: uuid
        priceCents:
          description: Bruttopreis in Cent (ganzzahlig, nie Gleitkomma)
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          example: 4900
        active:
          description: Nur aktive Pakete werden Kunden angeboten
          type: boolean
          default: true
    DownloadPackage:
      allOf:
        - $ref: '#/components/schemas/DownloadPackageInput'
        - type: object
          required: [id, active, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ShippingMethodInput:
      type: object
      required: [name, priceCents]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Standardversand
        priceCents:
          description: Versandkosten brutto in Cent (ganzzahlig, nie Gleitkomma)
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          example: 490
        active:
          description: Nur aktive Versandarten werden Kunden angeboten
          type: boolean
          default: true
    ShippingMethod:
      allOf:
        - $ref: '#/components/schemas/ShippingMethodInput'
        - type: object
          required: [id, active, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    PriceList:
      type: object
      required: [settings, products, downloadPackages, shippingMethods]
      properties:
        settings:
          $ref: '#/components/schemas/PriceListSettings'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        downloadPackages:
          type: array
          items:
            $ref: '#/components/schemas/DownloadPackage'
        shippingMethods:
          type: array
          items:
            $ref: '#/components/schemas/ShippingMethod'
    # --- end price list ---
    # --- studio profile (#20) ---
    Country:
      description: Land der Studio-Adresse (bestimmt das PLZ-Format)
      type: string
      enum: [DE, AT, CH]
    StudioProfileInput:
      description: |
        Stammdaten des Studios, die Kunden später in Galerie, Checkout und Impressum sehen. Leere optionale Felder
        werden entfernt. Formatregeln wie im Frontend; Kontoinhaber und IBAN nur gemeinsam.
      type: object
      required: [displayName, country]
      properties:
        displayName:
          description: Name, unter dem das Studio auftritt
          type: string
          maxLength: 100
          example: Lichtblick Fotografie
        street:
          description: Straße mit Hausnummer
          type: string
          maxLength: 200
        postalCode:
          description: DE 5 Ziffern, AT/CH 4 Ziffern
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 100
        country:
          $ref: '#/components/schemas/Country'
        email:
          type: string
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        website:
          description: Wird mit https:// gespeichert, wenn kein Schema angegeben ist
          type: string
          maxLength: 200
        taxNumber:
          description: Steuernummer, 8 bis 13 Ziffern mit / - oder Leerzeichen
          type: string
          maxLength: 30
        vatId:
          description: USt-IdNr. bzw. UID (DE123456789, ATU12345678, CHE-123.456.789 MWST); gespeichert ohne Leerzeichen
          type: string
          maxLength: 30
        accountHolder:
          type: string
          maxLength: 100
        iban:
          description: IBAN mit gültiger Prüfsumme; gespeichert ohne Leerzeichen in Großbuchstaben
          type: string
          maxLength: 42
        bic:
          description: BIC mit 8 oder 11 Zeichen
          type: string
          maxLength: 11
    StudioProfile:
      allOf:
        - $ref: '#/components/schemas/StudioProfileInput'
        - type: object
          properties:
            updatedAt:
              description: Fehlt, solange das Profil noch nie gespeichert wurde
              type: string
              format: date-time
    LegalTextKind:
      description: |
        TERMS_AND_CONDITIONS = AGB, CANCELLATION_POLICY = Widerrufsbelehrung, IMPRINT = Impressum,
        PRIVACY_POLICY = Datenschutzerklärung
      type: string
      enum: [TERMS_AND_CONDITIONS, CANCELLATION_POLICY, IMPRINT, PRIVACY_POLICY]
    LegalTextInput:
      type: object
      required: [markdown]
      properties:
        markdown:
          description: Text als Markdown (höchstens 50.000 Zeichen); leer = Text entfernen
          type: string
          maxLength: 50000
    LegalText:
      type: object
      required: [kind, markdown]
      properties:
        kind:
          $ref: '#/components/schemas/LegalTextKind'
        markdown:
          type: string
        updatedAt:
          type: string
          format: date-time
    # --- end studio profile ---
    # --- galleries (#8) ---
    GalleryStatus:
      description: DRAFT = Entwurf (noch nie online), ONLINE = für Kunden sichtbar, OFFLINE = vorübergehend nicht sichtbar
      type: string
      enum: [DRAFT, ONLINE, OFFLINE]
    GalleryInput:
      type: object
      required: [name, customerIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Hochzeit Becker
        description:
          description: Begrüßungstext für den Kunden
          type: string
          maxLength: 1000
        expiresOn:
          description: Bis einschließlich diesem Tag ist die Galerie für Kunden erreichbar; leer = unbegrenzt
          type: string
          format: date
        customerIds:
          description: Zugeordnete Kunden des Studios (auch leer möglich)
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    GalleryCustomer:
      type: object
      required: [id, firstName, lastName, email]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
    Gallery:
      type: object
      required: [id, name, status, expired, customers, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/GalleryStatus'
        expiresOn:
          type: string
          format: date
        expired:
          description: Ablaufdatum überschritten – Kunden haben keinen Zugriff mehr, auch wenn der Status ONLINE ist
          type: boolean
        publishedAt:
          description: Zeitpunkt der letzten Veröffentlichung
          type: string
          format: date-time
        customers:
          type: array
          items:
            $ref: '#/components/schemas/GalleryCustomer'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GalleryPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Gallery'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
    # --- end galleries ---
    CurrentStudioUser:
      type: object
      required: [username, roles, studio]
      properties:
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [STUDIO_ADMIN, PHOTOGRAPHER]
        studio:
          $ref: '#/components/schemas/StudioSummary'
    StudioSummary:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    CreateTenantRequest:
      type: object
      required: [slug, name, adminEmail]
      properties:
        slug:
          type: string
          description: Eindeutiges Kürzel, als Subdomain verwendbar
          pattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
          example: studio-mueller
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Fotostudio Müller
        adminEmail:
          type: string
          format: email
          maxLength: 254
          description: E-Mail des ersten Studio-Admins; erhält eine Einladung zum Setzen des Passworts
          example: inhaber@studio-mueller.de
        adminFirstName:
          type: string
          maxLength: 100
          example: Maria
        adminLastName:
          type: string
          maxLength: 100
          example: Müller
    TenantResponse:
      type: object
      required: [id, slug, name, status, onboardingStatus, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        onboardingStatus:
          type: string
          description: |
            PENDING: Keycloak-Organisation und erster Studio-Admin werden noch angelegt (bei Fehlern automatisch wiederholt).
            COMPLETED: Organisation angelegt, Einladung an den Studio-Admin verschickt.
          enum: [PENDING, COMPLETED]
        onboardingError:
          type: string
          description: |
            Grund des letzten fehlgeschlagenen Onboarding-Versuchs (deutsch, für den Betreiber), z. B. eine E-Mail-Adresse,
            die schon zu einem anderen Studio gehört. Fehlt, solange kein Versuch fehlgeschlagen ist und nach Erfolg.
        onboardingFailedAt:
          type: string
          format: date-time
          description: Zeitpunkt des letzten fehlgeschlagenen Onboarding-Versuchs (nur zusammen mit onboardingError)
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      description: Fehlerbeschreibung nach RFC 9457
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    SystemInfo:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          example: photoffice-backend
        version:
          type: string
          example: 0.0.1-SNAPSHOT
