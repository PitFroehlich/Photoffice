<app-page-header [title]="title()" [subtitle]="customerId() ? 'Kundendaten bearbeiten' : 'Neuen Kunden anlegen'">
  @if (customerId()) {
    <button matButton="outlined" type="button" class="delete-button" actions (click)="remove()">
      <mat-icon svgIcon="delete" />
      Löschen
    </button>
  }
</app-page-header>

@if (loading()) {
  <app-loading-indicator />
} @else {
  <mat-card appearance="outlined" class="card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" novalidate>
        <fieldset>
          <legend>Kontakt</legend>
          <div class="row">
            <mat-form-field>
              <mat-label>Vorname</mat-label>
              <input matInput formControlName="firstName" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.firstName" /></mat-error>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Nachname</mat-label>
              <input matInput formControlName="lastName" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.lastName" /></mat-error>
            </mat-form-field>
          </div>
          <div class="row">
            <mat-form-field>
              <mat-label>E-Mail</mat-label>
              <input matInput type="email" formControlName="email" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.email" /></mat-error>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Telefon</mat-label>
              <input matInput type="tel" formControlName="phone" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.phone" /></mat-error>
            </mat-form-field>
          </div>
        </fieldset>

        <fieldset>
          <legend>Adresse</legend>
          <mat-form-field class="full">
            <mat-label>Straße und Hausnummer</mat-label>
            <input matInput formControlName="street" autocomplete="off" />
            <mat-error><app-field-error [control]="form.controls.street" /></mat-error>
          </mat-form-field>
          <div class="row postal">
            <mat-form-field>
              <mat-label>PLZ</mat-label>
              <input matInput formControlName="postalCode" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.postalCode" /></mat-error>
            </mat-form-field>
            <mat-form-field>
              <mat-label>Ort</mat-label>
              <input matInput formControlName="city" autocomplete="off" />
              <mat-error><app-field-error [control]="form.controls.city" /></mat-error>
            </mat-form-field>
          </div>
        </fieldset>

        <fieldset>
          <legend>Notizen</legend>
          <mat-form-field class="full">
            <mat-label>Interne Notizen (für den Kunden nicht sichtbar)</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
            <mat-error><app-field-error [control]="form.controls.notes" /></mat-error>
          </mat-form-field>
        </fieldset>

        <div class="form-actions">
          <a matButton routerLink="/studio/kunden">Abbrechen</a>
          <button matButton="filled" type="submit" [disabled]="saving()">Speichern</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
