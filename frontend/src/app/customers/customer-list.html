<app-page-header title="Kunden" [subtitle]="subtitle()">
  <a matButton="filled" routerLink="neu" actions>
    <mat-icon svgIcon="person_add" />
    Neuer Kunde
  </a>
</app-page-header>

<app-search-field label="Name, E-Mail oder Ort suchen" [initialValue]="search()" (search)="onSearch($event)" />

@if (loading()) {
  <app-loading-indicator />
}

@if (result(); as page) {
  @if (page.totalElements === 0) {
    @if (search()) {
      <app-empty-state icon="person_search" title="Keine Treffer" message="Passen Sie den Suchbegriff an." />
    } @else {
      <app-empty-state icon="group" title="Noch keine Kunden" message="Legen Sie Ihren ersten Kunden an.">
        <a matButton="filled" routerLink="neu">Ersten Kunden anlegen</a>
      </app-empty-state>
    }
  } @else {
    <div class="table-scroll">
      <table mat-table [dataSource]="page.items" class="table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let customer">
            <a [routerLink]="customer.id" class="name-link">{{ fullName(customer) }}</a>
          </td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-Mail</th>
          <td mat-cell *matCellDef="let customer">{{ customer.email }}</td>
        </ng-container>
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Telefon</th>
          <td mat-cell *matCellDef="let customer">{{ customer.phone }}</td>
        </ng-container>
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>Ort</th>
          <td mat-cell *matCellDef="let customer">{{ customer.city }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Aktionen</span></th>
          <td mat-cell *matCellDef="let customer" class="actions-cell">
            <a
              matIconButton
              [routerLink]="customer.id"
              [attr.aria-label]="fullName(customer) + ' bearbeiten'"
              matTooltip="Bearbeiten"
            >
              <mat-icon svgIcon="edit" />
            </a>
            <button
              matIconButton
              type="button"
              [attr.aria-label]="fullName(customer) + ' löschen'"
              matTooltip="Löschen"
              (click)="remove(customer)"
            >
              <mat-icon svgIcon="delete" />
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
    <mat-paginator
      [length]="page.totalElements"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[10, 25, 50, 100]"
      (page)="onPage($event)"
    />
  }
}
