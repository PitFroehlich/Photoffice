<app-page-header
  title="UI-Bausteine"
  subtitle="Referenz für alle Studio-Seiten (nur in der Entwicklung sichtbar)"
>
  <button matButton="outlined" type="button" actions (click)="showError()">
    <mat-icon svgIcon="error" />
    Fehlermeldung zeigen
  </button>
</app-page-header>

<section aria-labelledby="list-heading" class="block">
  <h2 id="list-heading">Liste mit Suche, Seitenwechsel und Leerzustand</h2>
  <app-search-field label="Name oder Ort suchen" (search)="onSearch($event)" />
  @if (loading()) {
    <app-loading-indicator />
  }
  @if (filtered().length === 0) {
    <app-empty-state
      icon="person_search"
      title="Keine Treffer"
      message="Passen Sie den Suchbegriff an."
    />
  } @else {
    <div class="table-scroll">
      <table mat-table [dataSource]="page()" class="table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>E-Mail</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>Ort</th>
          <td mat-cell *matCellDef="let row">{{ row.city }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>
            <span class="cdk-visually-hidden">Aktionen</span>
          </th>
          <td mat-cell *matCellDef="let row" class="actions-cell">
            <button
              matIconButton
              type="button"
              [attr.aria-label]="row.name + ' löschen'"
              matTooltip="Löschen"
              (click)="remove(row)"
            >
              <mat-icon svgIcon="delete" />
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
    <mat-paginator
      [length]="filtered().length"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="onPage($event)"
    />
  }
</section>

<section aria-labelledby="form-heading" class="block">
  <h2 id="form-heading">Formular mit Validierung</h2>
  <mat-card appearance="outlined">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="form" novalidate>
        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" autocomplete="name" />
          <mat-error><app-field-error [control]="form.controls.name" /></mat-error>
        </mat-form-field>
        <mat-form-field>
          <mat-label>E-Mail</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error><app-field-error [control]="form.controls.email" /></mat-error>
        </mat-form-field>
        <div class="form-actions">
          <button matButton type="button" (click)="form.reset()">Zurücksetzen</button>
          <button matButton="filled" type="submit">Speichern</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
