# Photoffice login theme (issue #36, ADR 0009): standard theme keycloak.v2 + Photoffice colours, font and logo.
# Only German texts are adjusted (messages/messages_de.properties); the realm offers German only.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2 styles first, then the Photoffice overrides
styles=css/styles.css css/photoffice.css

# The app is light by default; the login pages follow it
darkMode=false
