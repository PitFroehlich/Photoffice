# Photoffice wording for Keycloak e-mails (issue #36). Keys not listed here come from the Keycloak standard
# translation (base/email/messages_de.properties). MessageFormat: write a single quote as ''.

# Shared building blocks (template.ftl)
photofficeGreeting=Hallo,
photofficeGreetingName=Hallo {0} {1},
photofficeLinkFallback=Falls der Button nicht funktioniert, kopieren Sie diesen Link in Ihren Browser:
photofficeLinkExpiration=Der Link ist {0} gültig.
photofficeFooter=Diese E-Mail wurde automatisch von Photoffice verschickt. Bitte antworten Sie nicht darauf.

# Invitation of a new studio admin (execute-actions-email)
executeActionsSubject=Willkommen bei Photoffice – bitte richten Sie Ihren Zugang ein
executeActionsTitle=Willkommen bei Photoffice!
executeActionsIntro=für Sie wurde ein Zugang zu Photoffice eingerichtet, der Plattform für Fotostudios.
executeActionsSteps=Damit Sie loslegen können, fehlt nur noch: {0}. Das dauert keine Minute.
executeActionsButton=Passwort festlegen
executeActionsIgnore=Sie haben keinen Zugang erwartet? Dann können Sie diese E-Mail einfach ignorieren.

# Forgot password
passwordResetSubject=Photoffice: Neues Passwort festlegen
passwordResetTitle=Neues Passwort festlegen
passwordResetIntro=Sie haben ein neues Passwort für Ihren Photoffice-Zugang angefordert. Über den folgenden Link legen Sie es fest.
passwordResetButton=Neues Passwort festlegen
passwordResetIgnore=Sie haben kein neues Passwort angefordert? Dann ignorieren Sie diese E-Mail. Ihr bisheriges Passwort bleibt gültig.

# Steps listed in the invitation
requiredAction.UPDATE_PASSWORD=Passwort festlegen
requiredAction.VERIFY_EMAIL=E-Mail-Adresse bestätigen
requiredAction.UPDATE_PROFILE=Name ergänzen
