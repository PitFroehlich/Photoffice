services:
  web:
    build:
      context: .
      target: base
    container_name: photoffice-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:z
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:5.7
    container_name: photoffice-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fotoffice
    volumes:
      - ./photoffice.sql:/docker-entrypoint-initdb.d/01-photoffice.sql
      - ./photoffice_seed.sql:/docker-entrypoint-initdb.d/02-photoffice_seed.sql
      - db_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: photoffice-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
