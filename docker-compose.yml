# Lokale Entwicklungsumgebung für den Neubau (ADR 0003, ADR 0004).
# Start: docker compose up -d   – Backend und Frontend laufen lokal außerhalb von Docker (siehe AGENTS.md).
# Alle Zugangsdaten hier sind reine Entwicklungswerte.
name: photoffice

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: photoffice
      POSTGRES_USER: photoffice
      POSTGRES_PASSWORD: photoffice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photoffice -d photoffice"]
      interval: 5s
      retries: 10

  # S3-kompatibler Object Storage (lokaler Ersatz für Hetzner Object Storage)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3-API
      - "9333:9333"   # Master-UI
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Legt den Bucket einmalig über die S3-API an
  seaweedfs-init:
    image: curlimages/curl:8.16.0
    depends_on:
      - seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" --user photoffice:photoffice-dev-secret -X PUT http://seaweedfs:8333/photoffice \
          || curl -sf -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" --user photoffice:photoffice-dev-secret http://seaweedfs:8333/photoffice; do sleep 2; done
        echo "Bucket photoffice bereit"
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./infra/keycloak/photoffice-realm.json:/opt/keycloak/data/import/photoffice-realm.json:ro
    depends_on:
      - mailpit

  # Fängt alle E-Mails ab (z. B. Keycloak-Einladung "Passwort setzen"); Web-UI http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"   # Web-UI und API
      - "1025:1025"   # SMTP

  imgproxy:
    image: darthsim/imgproxy:v3
    environment:
      IMGPROXY_KEY: 943b421c9eb07c830af81030552c86009268de4e532ba2ee2eab8247c6da0881
      IMGPROXY_SALT: 520f986b998545b4785e0defbc4f3c1203f22de2374a3d53cb7a7fe9fea309c5
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://seaweedfs:8333
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: photoffice
      AWS_SECRET_ACCESS_KEY: photoffice-dev-secret
    ports:
      - "8081:8080"
    depends_on:
      - seaweedfs

volumes:
  postgres_data:
  seaweedfs_data:
