spring:
  application:
    name: photoffice-backend
  # Lokale Entwicklung: Dienste aus docker-compose.yml im Repo-Root
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/photoffice}
    username: ${DB_USER:photoffice}
    password: ${DB_PASSWORD:photoffice}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # 4.9 for an integer field (e.g. priceCents) is an error, not silently 4 (#13)
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Changesets with a context (e.g. test data "dev") only run when that context is active
    contexts: default
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak-Realm; lokal aus docker-compose.yml
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/photoffice}
          audiences: photoffice-api
  modulith:
    events:
      jdbc:
        # Schema kommt ausschließlich aus Liquibase (db/changelog)
        schema-initialization:
          enabled: false
      # Hängengebliebene Zustellungen gelten nach dieser Zeit als fehlgeschlagen und werden erneut zugestellt
      # (EventResubmission); Listener müssen idempotent sein
      staleness:
        check-interval: PT1M
        published: PT10M
        processing: PT10M
        resubmitted: PT10M

photoffice:
  onboarding:
    # Studio-Onboarding in Keycloak (Issue #24); in Tests ohne Keycloak abgeschaltet
    enabled: true
  keycloak:
    # Service-Account für die Keycloak Admin API; Standardwerte passen zu docker-compose.yml (nur Entwicklung)
    server-url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:photoffice}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:photoffice-backend}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:photoffice-backend-dev-secret}
    invitation:
      client-id: photoffice-frontend
      redirect-uri: ${FRONTEND_URL:http://localhost:4200}/
      lifespan: 72h
  events:
    resubmission:
      interval: PT5M
      min-age: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
